name: Seek Job Bot

on:
  schedule:
    - cron: "0 22 */3 * *"   # runs every 3 days at 8am Brisbane time (AEST UTC+10)
  workflow_dispatch:          # lets you run it manually anytime from GitHub

jobs:
  post-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install slack-sdk requests beautifulsoup4

      - name: Run Seek bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python seek_bot_debug.py
